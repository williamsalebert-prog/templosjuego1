<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Templos - Juego</title>
<style>
    :root{
        --rojo:#b5302f; --azul:#2b4f9e; --oro:#cda86b; --oro-claro:#e7cf9c;
        --madera-osc:#241712; --madera:#3b261c; --panel:#1e1410;
        --tablero-w: min(86vw, 78vh, 820px);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background:
            radial-gradient(ellipse at top left, rgba(80,55,30,0.25), transparent 55%),
            radial-gradient(ellipse at bottom right, rgba(40,20,10,0.4), transparent 55%),
            radial-gradient(ellipse at center, #18120d 0%, #0c0907 100%);
        display: flex; justify-content: center; align-items: center; height: 100vh;
        font-family: 'Segoe UI', Georgia, serif; margin: 0; color: var(--oro-claro);
        overflow: hidden; padding: 8px;
    }
    .game-shell {
        display: flex; gap: 12px; align-items: stretch;
        width: 100%; height: 100%; max-width: 1400px; max-height: 980px;
    }

    /* ---------- Panel lateral izquierdo: TODO lo que no es tablero ---------- */
    .panel-lateral {
        background: linear-gradient(160deg, #2a1d15, #1a120c);
        border-radius: 16px; border: 1px solid #4a3424;
        box-shadow: 0 14px 36px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.35);
        padding: 10px; display: flex; flex-direction: column; gap: 8px;
        width: 240px; min-width: 200px; flex-shrink: 0;
        overflow-y: auto;
    }
    .panel-lateral::-webkit-scrollbar { width: 6px; }
    .panel-lateral::-webkit-scrollbar-thumb { background: #4a3424; border-radius: 6px; }

    .btn-volver {
        padding: 8px 10px; border-radius: 10px; border: 1px solid #6b4c2c;
        background: linear-gradient(160deg,#3a2a1c,#241712); color:#e7cf9c;
        cursor: pointer; font-weight: bold; font-size: 0.85rem; width: 100%;
    }
    .btn-ayuda-tablero {
        position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%;
        border: 1px solid var(--oro); background: radial-gradient(circle at 35% 30%, #4a3424, #1a120c);
        color: var(--oro-claro); cursor: pointer; font-weight: bold; font-size: 0.95rem;
        display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 6px rgba(0,0,0,0.5); z-index: 5;
    }

    #estadoJuego { font-size: 0.85rem; color:#ffb84d; font-weight:bold; min-height: 1.1em; text-align:center; }

    .bloque {
        background: linear-gradient(160deg, #2d2118, #1a130d);
        border: 1px solid #4a3424; border-radius: 12px; padding: 8px 10px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .bloque h4 { margin:0 0 6px; font-size:0.65rem; letter-spacing:1px; color:#a98a5a; text-transform:uppercase; text-align:center; }

    #turnoTexto { font-weight: bold; font-size: 0.95rem; padding: 6px 8px; border-radius: 8px; display:block; text-align:center; transition: all .2s; }
    #turnoTexto.turno-rojo { color:#fff; background: linear-gradient(135deg, var(--rojo), #7a1f1e); box-shadow: 0 0 12px rgba(181,48,47,0.6); }
    #turnoTexto.turno-azul { color:#fff; background: linear-gradient(135deg, var(--azul), #1c356b); box-shadow: 0 0 12px rgba(43,79,158,0.6); }
    #contadorJugadas { margin-top:5px; font-size:0.72rem; color:#cbb892; text-align:center; }

    #panelRelojes { display:none; gap:6px; }
    .reloj { flex:1; font-family: 'Courier New', monospace; font-size:1.05rem; text-align:center; padding:5px 4px; border-radius:8px; background:#100b08; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); }
    .reloj-activo { box-shadow: 0 0 10px #ffd166, inset 0 2px 6px rgba(0,0,0,0.6); }
    .reloj-bajo { color:#ff5050; }

    .tira-capturadas { display:flex; flex-wrap:wrap; gap:4px; min-height: 22px; }
    .grupo-capturado {
        display:inline-flex; align-items:center; gap:3px; padding: 2px 5px;
        border-radius: 8px; background: #100b08; font-size: 0.68rem; font-weight:bold;
    }
    .gc-icono {
        display:inline-flex; align-items:center; justify-content:center;
        width:16px; height:16px; border-radius:50%; background:#fff; color:#111; font-size:0.62rem;
    }
    .grupo-capturado.cap-rojo .gc-icono { border:2px solid var(--rojo); }
    .grupo-capturado.cap-azul .gc-icono { border:2px solid var(--azul); }
    .gc-cantidad { color: var(--oro-claro); }
    .gc-vacio { font-size: 0.7rem; opacity: 0.4; }
    .fila-capturas { display:flex; flex-direction:column; gap:6px; }

    .botones-juego { display:flex; flex-direction: column; gap:6px; }
    .botones-juego button, .modal-salida button, .panel-online-tablero button {
        padding: 8px 10px; border: 1px solid #6b4c2c; border-radius: 10px; cursor: pointer; font-weight: bold;
        background: linear-gradient(160deg, var(--oro-claro), var(--oro));
        color: #2a1c10; box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        transition: transform .1s; font-size: 0.78rem; width: 100%;
    }
    .botones-juego button:hover, .modal-salida button:hover { transform: translateY(-1px); filter:brightness(1.07); }
    .botones-juego button.peligro { background: linear-gradient(160deg,#c75b5b,#7a1f1e); color:#fff; }

    .panel-online-tablero { display:none; flex-direction:column; gap:6px; }
    .panel-online-tablero textarea {
        width:100%; height: 46px; resize: none; font-size: 0.68rem; padding: 5px;
        border-radius: 8px; border: 1px solid #4a3424; background:#100b08; color: var(--oro-claro);
        font-family: monospace;
    }
    .panel-online-tablero .fila-btns { display:flex; gap:4px; }
    .panel-online-tablero .fila-btns button { font-size: 0.68rem; padding: 6px 4px; }
    #avisoOnline { font-size: 0.68rem; text-align:center; color:#cbb892; }
    #onlineMiJugador { font-size: 0.7rem; text-align:center; font-weight:bold; color: var(--oro-claro); }

    /* ---------- Zona del tablero ---------- */
    .zona-tablero {
        flex: 1; display:flex; align-items:center; justify-content:center;
        position: relative; min-width: 0;
    }
    .marco-tablero {
        position: relative; border-radius: 10px;
        padding: 14px;
        background:
            repeating-linear-gradient(100deg, #5a3a22 0px, #6b4a2c 3px, #4a3220 6px, #5a3a22 9px),
            linear-gradient(160deg, #6b4a2c, #3a2615);
        box-shadow:
            0 0 0 3px #1a120c,
            0 0 0 6px var(--oro),
            0 18px 45px rgba(0,0,0,0.7),
            inset 0 2px 8px rgba(255,220,160,0.15),
            inset 0 -6px 18px rgba(0,0,0,0.55);
    }
    canvas {
        display: block; width: var(--tablero-w); height: calc(var(--tablero-w) * 10 / 15);
        max-width: 100%; border-radius: 4px; cursor: pointer;
        box-shadow: inset 0 0 0 2px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.5);
    }

    .menu-coronacion, .modal-salida, .banner-fin {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(10,7,5,0.95); padding: 18px; border-radius: 16px; display: none; z-index: 20;
        text-align: center; color: #f4e3c4; border:1px solid var(--oro);
        box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }
    .menu-coronacion button { margin: 8px; padding: 10px; background: var(--oro); border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 80px; }
    .menu-coronacion button img { width: 40px; height: 40px; display: block; margin: 0 auto 5px; }

    .banner-fin { min-width: 300px; max-width: 92vw; }
    .banner-fin.mostrar { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .banner-fin h2 { margin:0; font-size:1.3rem; }
    .banner-fin.victoria.jugador0 h2, .banner-fin.victoria.jugador0 #bannerFinTexto { color: var(--rojo); }
    .banner-fin.victoria.jugador1 h2, .banner-fin.victoria.jugador1 #bannerFinTexto { color: var(--azul); }
    .banner-fin.tablas #bannerFinTexto { color: #8fcf8f; }
    #bannerFinTexto { font-size: 1.1rem; font-weight: bold; }
    .fin-botones { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .fin-botones button { padding:9px 16px; border-radius:10px; border:none; font-weight:bold; cursor:pointer; }
    #btnFinListo { background: linear-gradient(160deg,#8fcf8f,#3f7a3f); color:#0c1c0c; }
    #btnFinExportar { background: var(--oro); color:#2a1c10; }
    #btnFinExportar:disabled { opacity: 0.45; cursor: not-allowed; }
    #finJuegoContador { font-size: 0.78rem; color:#cbb892; min-height: 1.2em; }

    .modal-salida p { margin:0 0 14px; font-size:1.0rem; }

    /* ---------- Responsive móvil: apilar panel arriba/abajo del tablero ---------- */
    @media (max-width: 820px), (max-height: 560px) {
        body { overflow-y: auto; height: auto; min-height: 100vh; align-items: flex-start; padding: 6px; }
        .game-shell { flex-direction: column; max-height: none; height: auto; }
        .panel-lateral { width: 100%; max-height: 38vh; flex-direction: row; flex-wrap: wrap; }
        .panel-lateral > * { flex: 1 1 auto; }
        :root { --tablero-w: min(96vw, 96vw); }
        .zona-tablero { order: -1; }
        .marco-tablero { padding: 8px; }
    }
    @media (max-width: 480px) {
        .panel-lateral { flex-direction: column; max-height: none; }
    }
</style>
</head>
<body>
<div class="game-shell">

    <div class="panel-lateral">
        <button id="btnVolverMenu" class="btn-volver">⬅ Menú principal</button>
        <div id="estadoJuego"></div>

        <div class="bloque">
            <div id="turnoTexto" class="turno-rojo">Turno: Jugador 1</div>
            <div id="contadorJugadas">Jugada: 0</div>
        </div>

        <div class="bloque" id="panelRelojes">
            <div class="reloj" id="relojJ0">5:00</div>
            <div class="reloj" id="relojJ1">5:00</div>
        </div>

        <div class="bloque fila-capturas">
            <h4>Capturas</h4>
            <div>
                <div style="font-size:0.62rem;color:var(--rojo);font-weight:bold;margin-bottom:2px;">Jugador 1 (Rojo)</div>
                <div class="tira-capturadas" id="capturadasJ0"></div>
            </div>
            <div>
                <div style="font-size:0.62rem;color:var(--azul);font-weight:bold;margin-bottom:2px;">Jugador 2 (Azul)</div>
                <div class="tira-capturadas" id="capturadasJ1"></div>
            </div>
        </div>

        <div class="bloque panel-online-tablero" id="panelOnline">
            <h4>Partida online (en vivo)</h4>
            <div id="onlineMiJugador"></div>
            <div id="avisoOnline"></div>
            <div id="contenedorCodigoSala"></div>
        </div>

        <div class="botones-juego">
            <button id="btnMusica">🎵 Música</button>
            <button id="btnExportarPartida">💾 Exportar partida</button>
            <button id="btnImportarPartida">📂 Importar partida</button>
            <input type="file" id="inputImportarPartida" accept=".json" style="display:none;">
        </div>
    </div>

    <div class="zona-tablero">
        <button class="btn-ayuda-tablero" id="btnAyudaTablero" title="Ayuda">?</button>
        <div class="marco-tablero">
            <canvas id="tableroCanvas" width="900" height="600"></canvas>
        </div>

        <div id="menuCoronacion" class="menu-coronacion">
            <p>Elige coronación:</p>
            <div id="opcionesCoronacion"></div>
        </div>

        <div id="bannerFin" class="banner-fin">
            <h2>Fin de la partida</h2>
            <div id="bannerFinTexto"></div>
            <div id="finJuegoContador">Volviendo al menú en 8s...</div>
            <div class="fin-botones">
                <button id="btnFinListo">✅ Listo</button>
                <button id="btnFinExportar">💾 Exportar partida (3 disponibles)</button>
            </div>
        </div>

        <div id="modalConfirmarSalida" class="modal-salida">
            <p>¿Seguro que quieres volver al menú principal?<br>Se perderá la partida actual si no la exportaste.</p>
            <button id="btnConfirmarSalida" class="peligro" style="background:#7a1f1e;color:#fff;">Sí, salir</button>
            <button id="btnCancelarSalida">Cancelar</button>
        </div>
    </div>

</div>

<script src="js/zonas.js"></script>
<script src="js/pieza.js"></script>
<!-- piezas -->
<script src="js/f0.js"></script>
<script src="js/f1.js"></script>
<script src="js/f2.js"></script>
<script src="js/f3.js"></script>
<script src="js/f4.js"></script>
<script src="js/f5.js"></script>
<script src="js/f6.js"></script>
<!-- módulos base -->
<script src="js/config.js"></script>
<script src="js/carcela.js"></script>
<script src="js/historial.js"></script>
<script src="js/sonido.js"></script>
<script src="js/animacion.js"></script>
<script src="js/dibujo.js"></script>
<script src="js/jaque.js"></script>
<script src="js/jaquemate.js"></script>
<script src="js/ahogado.js"></script>
<script src="js/enroque.js"></script>
<script src="js/coronacion.js"></script>
<script src="js/interfaz.js"></script>
<script src="js/relojes.js"></script>
<script src="js/finjuego.js"></script>
<script src="js/ia.js"></script>
<script src="js/partida.js"></script>
<script src="js/sync.js"></script>
<!-- orquestador -->
<script src="js/tablero.js"></script>
<script src="js/musica.js"></script>
<script>
    const btnAyudaTablero = document.getElementById('btnAyudaTablero');
    if (btnAyudaTablero) btnAyudaTablero.addEventListener('click', () => { window.location.href = 'index.html'; });
</script>
</body>
</html>
