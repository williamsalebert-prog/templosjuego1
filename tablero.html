<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Templos - Juego</title>
    <style>
        body { background: #1a472a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .game-container { background: #2c5e2e; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; position: relative; }
        canvas { display: block; margin: 0 auto; box-shadow: 0 0 0 4px #c9a87b, 0 0 0 8px #6b3e1c; border-radius: 8px; cursor: pointer; }
        /* Solo se mantiene el menú de coronación, oculto por defecto */
        .menu-coronacion {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 15px;
            display: none;
            z-index: 10;
            text-align: center;
            color: white;
        }
        .menu-coronacion button {
            margin: 8px;
            padding: 10px;
            background: #c9a87b;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 80px;
        }
        .menu-coronacion button img {
            width: 40px;
            height: 40px;
            display: block;
            margin: 0 auto 5px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="tableroCanvas" width="650" height="500"></canvas>
    <!-- Menú de coronación (oculto hasta que se active) -->
    <div id="menuCoronacion" class="menu-coronacion">
        <p>Elige coronación:</p>
        <div id="opcionesCoronacion"></div>
    </div>
</div>

<script src="js/zonas.js"></script>
<script src="js/pieza.js"></script>
<script src="js/f0.js"></script>
<script src="js/f1.js"></script>
<script src="js/f2.js"></script>
<script src="js/f3.js"></script>
<script src="js/f4.js"></script>
<script src="js/f5.js"></script>
<script src="js/f6.js"></script>
<script src="js/carcela.js"></script>
<script src="js/historial.js"></script>
<script src="js/tablero.js"></script>
</body>
</html>
