<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Templos - Pirámides 1,3,5,7</title>
    <style>
        body {
            background: #1a472a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            box-shadow: 0 0 0 6px #c9a87b, 0 0 0 12px #6b3e1c;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<canvas id="tableroCanvas" width="750" height="750"></canvas>
<script>
    const TAM = 15;
    const CELL_SIZE = 750 / TAM;
    const canvas = document.getElementById('tableroCanvas');
    const ctx = canvas.getContext('2d');

    function getTipoCelda(fila, col) {
        // Templo J1 (arriba) pirámide 1,3,5,7
        if (fila === 0 && col === 7) return 'templo1';
        if (fila === 1 && col >= 6 && col <= 8) return 'templo1';
        if (fila === 2 && col >= 5 && col <= 9) return 'templo1';
        if (fila === 3 && col >= 4 && col <= 10) return 'templo1';

        // Templo J2 (abajo) pirámide 1,3,5,7
        if (fila === 14 && col === 7) return 'templo2';
        if (fila === 13 && col >= 6 && col <= 8) return 'templo2';
        if (fila === 12 && col >= 5 && col <= 9) return 'templo2';
        if (fila === 11 && col >= 4 && col <= 10) return 'templo2';

        // Jardín
        if (fila >= 4 && fila <= 10) return 'jardin';

        // Resto no jugable
        return 'vacio';
    }

    function dibujar() {
        for (let i = 0; i < TAM; i++) {
            for (let j = 0; j < TAM; j++) {
                const x = j * CELL_SIZE;
                const y = i * CELL_SIZE;
                const tipo = getTipoCelda(i, j);
                let color;
                switch (tipo) {
                    case 'templo1': color = '#e6c394'; break;
                    case 'templo2': color = '#b78f5a'; break;
                    case 'jardin': color = '#5a9e4e'; break;
                    default: color = '#2c2c2c';
                }
                ctx.fillStyle = color;
                ctx.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
                ctx.strokeStyle = '#a57c4c';
                ctx.strokeRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
            }
        }
    }

    dibujar();
</script>
</body>
</html>
