<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Templos - Pirámides Horizontales 7,5,3,1</title>
    <style>
        body {
            background: #1a472a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            box-shadow: 0 0 0 6px #c9a87b, 0 0 0 12px #6b3e1c;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<canvas id="tableroCanvas" width="750" height="750"></canvas>
<script>
    const TAM = 15;
    const CELL_SIZE = 750 / TAM; // 50px
    const canvas = document.getElementById('tableroCanvas');
    const ctx = canvas.getContext('2d');

    // Función que determina el tipo de celda según fila (i) y columna (j)
    function getTipoCelda(i, j) {
        // Templo izquierdo (jugador 1) - columnas 0 a 3
        if (j === 0 && i >= 4 && i <= 10) return 'templo1';      // 7 casillas
        if (j === 1 && i >= 5 && i <= 9) return 'templo1';       // 5 casillas
        if (j === 2 && i >= 6 && i <= 8) return 'templo1';       // 3 casillas
        if (j === 3 && i === 7) return 'templo1';                // 1 casilla

        // Templo derecho (jugador 2) - columnas 14 a 11
        if (j === 14 && i >= 4 && i <= 10) return 'templo2';
        if (j === 13 && i >= 5 && i <= 9) return 'templo2';
        if (j === 12 && i >= 6 && i <= 8) return 'templo2';
        if (j === 11 && i === 7) return 'templo2';

        // Jardín: columnas 4 a 10, todas las filas (0 a 14)
        if (j >= 4 && j <= 10) return 'jardin';

        // Cualquier otra celda (esquinas fuera de las pirámides) no jugable
        return 'vacio';
    }

    function dibujar() {
        for (let i = 0; i < TAM; i++) {
            for (let j = 0; j < TAM; j++) {
                const x = j * CELL_SIZE;
                const y = i * CELL_SIZE;
                const tipo = getTipoCelda(i, j);
                let color;
                switch (tipo) {
                    case 'templo1': color = '#e6c394'; break;
                    case 'templo2': color = '#b78f5a'; break;
                    case 'jardin': color = '#5a9e4e'; break;
                    default: color = '#2c2c2c';
                }
                ctx.fillStyle = color;
                ctx.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
                ctx.strokeStyle = '#a57c4c';
                ctx.strokeRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
            }
        }
    }

    dibujar();
</script>
</body>
</html>
