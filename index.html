<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Templos - Pirámides 7,5,3,1</title>
    <style>
        body {
            background: #1e3a1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            box-shadow: 0 0 0 6px #c49a6c, 0 0 0 12px #5e3a1e;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<canvas id="tableroCanvas" width="750" height="750"></canvas>
<script>
    const TAM = 15;
    const CELL_SIZE = 750 / TAM; // 50px
    const canvas = document.getElementById('tableroCanvas');
    const ctx = canvas.getContext('2d');

    // Determina tipo de celda según fila y columna
    function getTipoCelda(fila, col) {
        // Pirámide Jugador 1 (arriba) - filas 0 a 3
        if (fila === 0 && col >= 4 && col <= 10) return 'templo1';
        if (fila === 1 && col >= 5 && col <= 9) return 'templo1';
        if (fila === 2 && col >= 6 && col <= 8) return 'templo1';
        if (fila === 3 && col === 7) return 'templo1';

        // Pirámide Jugador 2 (abajo) - filas 11 a 14
        if (fila === 14 && col >= 4 && col <= 10) return 'templo2';
        if (fila === 13 && col >= 5 && col <= 9) return 'templo2';
        if (fila === 12 && col >= 6 && col <= 8) return 'templo2';
        if (fila === 11 && col === 7) return 'templo2';

        // Jardín (filas 4 a 10, todas las columnas)
        if (fila >= 4 && fila <= 10) return 'jardin';

        // Cualquier otra celda no jugable
        return 'vacio';
    }

    function dibujar() {
        for (let i = 0; i < TAM; i++) {
            for (let j = 0; j < TAM; j++) {
                const x = j * CELL_SIZE;
                const y = i * CELL_SIZE;
                const tipo = getTipoCelda(i, j);
                let color;
                switch (tipo) {
                    case 'templo1': color = '#e6c394'; break; // marrón claro
                    case 'templo2': color = '#b78f5a'; break; // marrón oscuro
                    case 'jardin': color = '#5a9e4e'; break;  // verde
                    default: color = '#2c2c2c'; // negro (no jugable)
                }
                ctx.fillStyle = color;
                ctx.fillRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
                ctx.strokeStyle = '#a57c4c';
                ctx.strokeRect(x, y, CELL_SIZE - 1, CELL_SIZE - 1);
            }
        }
    }

    dibujar();
</script>
</body>
</html>
