<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Templos - 15x15 con pirámides 7,5,3,1</title>
    <style>
        body {
            background: #2c4a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: monospace;
        }
        canvas {
            border: 4px solid #c9a87b;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .info {
            margin-top: 20px;
            background: #1e2a1a;
            color: #e6d5a8;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            max-width: 750px;
        }
    </style>
</head>
<body>
<div>
    <canvas id="tableroCanvas" width="750" height="750"></canvas>
    <div class="info">
        🔷 Tablero 15x15 | 🟫 Templos (pirámides 7,5,3,1 arriba y abajo) | ⬜ Jardín central
    </div>
</div>

<script>
    const TAM = 15;               // 15x15
    const CELL_SIZE = 750 / TAM;  // 50px

    const canvas = document.getElementById('tableroCanvas');
    const ctx = canvas.getContext('2d');

    // Función para saber si una casilla pertenece al templo superior (jugador 1) o inferior (jugador 2)
    // Templo superior: filas 0,1,2,3 con forma de pirámide centrada: 
    // fila 0: 7 casillas centrales
    // fila 1: 5 centrales
    // fila 2: 3 centrales
    // fila 3: 1 central
    // Templo inferior: filas 14,13,12,11 igual pero simétrico.
    function esTemploSuperior(fila, col) {
        if (fila === 0) {
            let inicio = (TAM - 7) / 2;  // (15-7)/2 = 4
            return col >= inicio && col < inicio + 7;
        }
        if (fila === 1) {
            let inicio = (TAM - 5) / 2;  // (15-5)/2 = 5
            return col >= inicio && col < inicio + 5;
        }
        if (fila === 2) {
            let inicio = (TAM - 3) / 2;  // (15-3)/2 = 6
            return col >= inicio && col < inicio + 3;
        }
        if (fila === 3) {
            let inicio = (TAM - 1) / 2;  // (15-1)/2 = 7
            return col === inicio;
        }
        return false;
    }

    function esTemploInferior(fila, col) {
        if (fila === 14) {
            let inicio = (TAM - 7) / 2;
            return col >= inicio && col < inicio + 7;
        }
        if (fila === 13) {
            let inicio = (TAM - 5) / 2;
            return col >= inicio && col < inicio + 5;
        }
        if (fila === 12) {
            let inicio = (TAM - 3) / 2;
            return col >= inicio && col < inicio + 3;
        }
        if (fila === 11) {
            let inicio = (TAM - 1) / 2;
            return col === inicio;
        }
        return false;
    }

    function dibujarTablero() {
        for (let fila = 0; fila < TAM; fila++) {
            for (let col = 0; col < TAM; col++) {
                let x = col * CELL_SIZE;
                let y = fila * CELL_SIZE;

                // Determinar color de fondo
                let color;
                if (esTemploSuperior(fila, col)) {
                    color = '#c9a87b'; // marrón claro (templo superior)
                } else if (esTemploInferior(fila, col)) {
                    color = '#b87c4f'; // marrón más oscuro (templo inferior)
                } else {
                    // Jardín central: alternar colores tipo dama
                    color = (fila + col) % 2 === 0 ? '#a2c48a' : '#6b8c42';
                }

                ctx.fillStyle = color;
                ctx.fillRect(x, y, CELL_SIZE - 0.5, CELL_SIZE - 0.5);

                // Borde sutil
                ctx.strokeStyle = '#3a2a1a';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

                // Opcional: marcar el centro de cada casilla con un puntito o número (para debug)
                ctx.fillStyle = '#00000088';
                ctx.font = `${CELL_SIZE * 0.24}px monospace`;
                ctx.fillText(`${fila},${col}`, x + CELL_SIZE*0.1, y + CELL_SIZE*0.4);
            }
        }

        // Dibujar un borde grueso alrededor del tablero
        ctx.strokeStyle = '#c9a87b';
        ctx.lineWidth = 4;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);
    }

    dibujarTablero();

    // Para que no se vea borroso si redimensionan (opcional)
    window.addEventListener('resize', () => {
        // no hacemos nada porque el canvas tiene tamaño fijo
    });
</script>
</body>
</html>
